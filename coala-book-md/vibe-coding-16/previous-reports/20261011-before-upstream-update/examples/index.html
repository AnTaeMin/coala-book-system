<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>바이브 코딩 · 교재용 실행 예제</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#182b45;font-family:'Malgun Gothic',sans-serif;font-size:21px}main{width:min(100vw,1000px);min-height:600px;padding:24px 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #dbe3ef;margin-bottom:25px;padding-bottom:16px}header b{font-size:25px}header span,.note{font-size:15px;color:#586a80}h1{font-size:35px;margin:5px 0 23px}h2{font-size:25px;margin:0 0 20px}p{line-height:1.7;margin:14px 0}.card{border:1px solid #d5deeb;background:white;border-radius:16px;padding:24px;flex:1;min-width:0}.row{display:flex;gap:24px}.fields{display:flex;gap:18px;align-items:end;margin:20px 0}label{display:block;margin-bottom:10px;font-size:21px}input,select{font:inherit;width:220px;padding:13px;border:2px solid #a4b4c9;border-radius:8px;background:#fff;color:#182b45}input[type=checkbox],input[type=radio]{width:23px;height:23px;vertical-align:middle}button{font:inherit;border:0;border-radius:9px;padding:14px 22px;background:#244cc1;color:white;cursor:pointer;white-space:nowrap}button.secondary{background:#e9eef8;color:#244cc1}.result{background:#eef4ff;border-left:5px solid #244cc1;border-radius:8px;padding:18px 22px;margin-top:20px;font-size:25px;line-height:1.6;min-height:77px}.error{background:#fff0ee;border-color:#d74b3f;color:#96382f}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #dbe3ef}th{background:#f1f5fb}small{font-size:17px;color:#596c86}ul{line-height:1.9}.sketch{border:3px dashed #97a9c1;background:#fcfdff;padding:23px;border-radius:10px}.sketch span{display:inline-block;border:2px solid #9aacc3;padding:12px 18px;margin:8px}.toolbar{width:min(100vw,1000px);padding:20px 42px;border-top:1px solid #dbe3ef}.bar{height:50px;background:#507ddc;border-radius:5px;color:white;display:flex;align-items:center;justify-content:end;padding:0 15px}.chart-row{display:flex;align-items:center;gap:15px;margin:30px 0}.chart-row strong{width:58px}.diagram-note{font-size:18px;color:#63738a}.badge{display:inline-block;background:#e9f3eb;color:#356242;border-radius:20px;padding:5px 12px;font-size:17px;margin-top:8px}
.study main{padding:16px 28px}.study header{padding-bottom:10px;margin-bottom:12px}.study h1{font-size:29px;margin:4px 0 12px}.study .card{padding:16px}.study .fields{margin:8px 0 12px}.study label{font-size:19px;margin-bottom:6px}.study input{font-size:20px;padding:9px}.study button{font-size:19px;padding:11px 18px}.study th,.study td{padding:8px 12px;font-size:20px}.study table{margin-top:12px}.study .result{font-size:23px;padding:12px 18px;min-height:56px;margin-top:12px}.study .chart-row{margin:14px 0}.study .bar{height:40px}.study .data-grid{display:flex;gap:24px;align-items:start}.study .data-grid table{width:53%}.study .data-grid #chart{flex:1;padding-top:32px}.study #status{margin-top:8px}
.capture main{width:100vw;min-height:100vh;padding:28px 42px}.capture .toolbar{display:none}.capture header b{font-size:32px}.capture header span{font-size:23px}.capture h1{font-size:44px;margin-bottom:22px}.capture h2{font-size:32px}.capture p,.capture li{font-size:29px}.capture label{font-size:30px}.capture input,.capture select{font-size:30px;width:300px}.capture button{font-size:28px}.capture .result{font-size:32px}.capture th,.capture td{font-size:30px;padding:12px 16px}.capture .note,.capture .diagram-note{font-size:23px}.capture input[type=checkbox],.capture input[type=radio]{width:29px;height:29px}.capture .bar{font-size:30px;height:54px}.capture .chart-row strong{width:80px;font-size:30px}.capture .chart-row{margin:24px 0}.capture .sketch span{font-size:28px}.capture .data-grid #chart{padding-top:42px}.capture .data-grid{gap:60px}
.capture.study main{padding:16px 30px}.capture.study h1{font-size:40px;margin:4px 0 12px}.capture.study header b{font-size:29px}.capture.study th,.capture.study td{padding:8px 16px}

/* Values stay outside bars so small totals remain readable. */
.chart-row strong{width:90px;flex:0 0 90px;overflow-wrap:anywhere}.bar-track{flex:1;min-width:0;background:#eef3fb;border-radius:5px}.bar{padding:0;width:0}.chart-value{flex:0 0 85px;text-align:right}.chart-title{font-size:20px;margin:0 0 10px}.chart-axis{font-size:17px;color:#586a80;display:flex;justify-content:space-between;gap:12px}.chart-empty{font-size:20px;line-height:1.6}.capture .chart-title{font-size:28px}.capture .chart-axis{font-size:23px}.capture .chart-value{font-size:28px;flex-basis:110px}.capture .chart-empty{font-size:28px}.study .data-grid #chart{min-width:0}
</style>
<main id="capture"><header><b>AI와 함께하는 바이브 코딩</b><span>교재용 신규 예제 · 브라우저에서 실행</span></header><section id="app"></section></main>
<nav class="toolbar" aria-label="차시 선택"></nav>
<script>
const params=new URLSearchParams(location.search),n=Number(params.get('lesson')||4),stage=params.get('stage')||'';
if(params.get('capture')==='1')document.body.classList.add('capture');
const app=document.getElementById('app');let records=[],selected=-1,graphEnabled=n!==12;
const $=id=>document.getElementById(id);
function output(text,err=false){$('result').textContent=text;$('result').className='result'+(err?' error':'')}
function number(id,min=0,max=100000){const raw=$(id).value.trim();if(!raw||!/^\d+$/.test(raw))throw Error('정수를 입력하세요.');let v=Number(raw);if(v<min||v>max)throw Error(`${min}~${max} 범위로 입력하세요.`);return v}
function signedInteger(id){const raw=$(id).value.trim();if(!/^[+-]?\d+$/.test(raw))throw Error('두 칸에 정수를 입력해 주세요.');const v=Number(raw);if(!Number.isSafeInteger(v))throw Error('정확히 표현할 수 있는 정수를 입력하세요.');return v}
function calculateSum(){protect(()=>{const total=signedInteger('first')+signedInteger('second');if(!Number.isSafeInteger(total))throw Error('정확히 표현할 수 있는 정수를 입력하세요.');output('합계 '+total)})}
function orderDrink(){protect(()=>{if(!$('drink').value)throw Error('음료를 선택하세요.');const cups=number('cups',1,5),name=$('drink').selectedOptions[0].textContent.split(' · ')[0];const total=(Number($('drink').value)+($('option').checked?500:0))*cups;output(name+' · '+cups+'잔 · 총액 '+total+'원')})}
function protect(fn){try{fn()}catch(e){output(e.message,true)}}
function field(id,label,type='text',value=''){return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${value}"></div>`}
function table(){return `<table><thead><tr><th>선택</th><th>과목</th><th>시간(분)</th></tr></thead><tbody id="rows"></tbody></table>`}
function renderChart(){
 if(!$('chart'))return;
 if(!graphEnabled){$('chart').innerHTML='<p class="chart-empty">그래프 보기를 눌러 과목별 합계를 확인하세요.</p>';return}
 if(!records.length){$('chart').innerHTML='<p class="chart-empty">기록이 없습니다. 과목과 시간을 추가하세요.</p>';return}
 const groups=new Map();records.forEach(r=>groups.set(r.subject,(groups.get(r.subject)||0)+r.time));
 const maximum=Math.max(...groups.values());
 $('chart').innerHTML='<h2 class="chart-title">과목별 공부 시간</h2><div class="chart-axis"><span>과목</span><span>시간(분) · 0~'+maximum+'</span></div>'+Array.from(groups,([subject,time])=>`<div class="chart-row"><strong>${escapeText(subject)}</strong><div class="bar-track"><div class="bar" style="width:${time/maximum*100}%"></div></div><span class="chart-value">${time}분</span></div>`).join('');
}
function render(){const total=records.reduce((s,r)=>s+r.time,0);$('rows').innerHTML=records.map((r,i)=>`<tr><td><input type="radio" name="row" aria-label="기록 ${i+1} 선택" onclick="selected=${i}"></td><td>${escapeText(r.subject)}</td><td>${r.time}</td></tr>`).join('');output(`기록 ${records.length}개 · 합계 ${total}분`+((n===8||n===11)?(records.length?` · 평균 ${(total/records.length).toFixed(1)}분`:' · 평균 기록 없음'):''));renderChart()}
function escapeText(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}
function add(){protect(()=>{let subject=$('subject').value.trim();if(!subject)throw Error('과목을 입력하세요.');let time=number('time',1,600);records.push({subject,time});selected=-1;render()})}
function study(){app.innerHTML=`<h1>${n}차시 · 공부 기록 앱</h1><div class="card"><div class="fields">${field('subject','과목')}${field('time','시간(분)','text')}<button onclick="add()">기록 추가</button></div><div class="row">${n>=10?'<button class="secondary" onclick="if(selected>=0){records.splice(selected,1);selected=-1;render()}else output(\'삭제할 기록을 선택하세요.\',true)">선택 삭제</button>':''}${n===11||n===16?'<button onclick="save()">저장</button><button onclick="load()">불러오기</button>':''}<button class="secondary" onclick="records=[];selected=-1;render()">전체 초기화</button></div>${table()}<div id="result" class="result"></div>${n===12||n===16?'<div id="chart" aria-label="과목별 공부 시간 막대그래프"></div>':''}<div id="status" class="note"></div></div>`;render()}
function validateSavedRecords(data){
 if(!Array.isArray(data)||data.some(r=>!r||typeof r!=='object'||typeof r.subject!=='string'||!r.subject.trim()||!Number.isInteger(r.time)||r.time<1||r.time>600))throw Error('저장 데이터가 올바르지 않습니다.');
 return data.map(r=>({subject:r.subject.trim(),time:r.time}));
}
function save(){protect(()=>{localStorage.setItem('coala-vibe-demo-v1',JSON.stringify(records));$('status').textContent='저장 완료 · 이 브라우저에 보관한 교재 예제 기록'})}
function load(){protect(()=>{const data=validateSavedRecords(JSON.parse(localStorage.getItem('coala-vibe-demo-v1')||'[]'));records=data;selected=-1;render();$('status').textContent='불러오기 완료 · 새 실행에서 저장한 기록 복원'})}
if(n===2){app.innerHTML=`<h1>2차시 · 같은 기능, 다른 요청</h1><div class="row"><div class="card"><h2>요청 A · 인사 앱을 만들어줘</h2><p>AI 답변을 가정한 교사 예제</p><button onclick="$('a-result').textContent='안녕!'">버튼</button><div id="a-result" class="result">결과를 기다리는 중</div></div><div class="card"><h2>요청 B · 화면과 동작 구체화</h2><p>버튼 이름과 결과 문구를 지정</p><button onclick="$('b-result').textContent='안녕하세요, 코알라!'">인사하기</button><div id="b-result" class="result">버튼을 눌러 주세요</div></div></div><p class="note">두 예제는 요청의 차이를 설명하기 위한 실행 자료입니다. 실제 AI 서비스의 응답 기록이 아닙니다.</p>`}
else if(n===3||n===13){app.innerHTML=`<h1>${n}차시 · 공부 기록 앱 ${n===3?'화면 설계':'기획서'}</h1><div class="row"><div class="card sketch"><h2>교사 예시 · 화면 스케치</h2><span>과목 입력</span><span>시간 입력</span><span>기록 추가</span><p>기록 목록</p><table><tr><th>과목</th><th>시간</th></tr><tr><td>수학</td><td>20분</td></tr><tr><td>영어</td><td>30분</td></tr></table><span>합계 50분</span></div><div class="card"><h2>핵심 기능 세 가지</h2><ul><li>과목과 시간을 입력한다.</li><li>기록을 목록에 추가한다.</li><li>전체 시간의 합계를 보여준다.</li></ul><p class="diagram-note">설계 단계의 예시입니다.<br>실제 앱 실행 화면과 구분합니다.</p></div></div>`}
else if(n===4){app.innerHTML=`<h1>4차시 · 이름을 받아 인사하기</h1><div class="card"><div class="fields">${field('name','이름')}<button onclick="let name=$('name').value.trim();output(name?'안녕하세요, '+name+'!':'이름을 입력하세요.',!name)">인사하기</button></div><div id="result" class="result">이름을 입력하고 인사하기를 눌러 주세요.</div></div>`}
else if(n===5){app.innerHTML=`<h1>5차시 · 두 수 더하기</h1><div class="card"><div class="fields">${field('first','첫 번째 수')}${field('second','두 번째 수')}<button onclick="calculateSum()">더하기</button></div><div id="result" class="result">두 정수를 입력하세요.</div></div>`}
else if(n===6){app.innerHTML=`<h1>6차시 · 도서 대출 가능 여부</h1><div class="card"><p>한 번에 빌릴 수 있는 도서는 최대 3권입니다.</p><div class="fields">${field('count','현재 대출 수')}<button onclick="protect(()=>output(number('count',0,10)<3?'추가 대출 가능':'추가 대출 불가'))">확인</button></div><div id="result" class="result">현재 대출 수를 입력하세요.</div></div>`}
else if(n===9){app.innerHTML=`<h1>9차시 · 선택해서 음료 주문하기</h1><div class="card"><div class="fields"><div><label for="drink">음료</label><select id="drink"><option value="">음료를 선택하세요</option><option value="2000">차 · 2,000원</option><option value="2500">코코아 · 2,500원</option><option value="3000">레모네이드 · 3,000원</option></select></div>${field('cups','수량(잔)')}<button onclick="orderDrink()">주문 확인</button></div><label><input id="option" type="checkbox"> 추가 옵션 · 한 잔당 500원</label><div id="result" class="result">음료와 수량을 선택하세요.</div></div>`}
else if(n===15){app.innerHTML=`<h1>15차시 · 같은 입력으로 수정 전후 확인</h1><div class="row"><div class="card"><h2>수정 전 · 오류 재현용 예제</h2>${field('old-time','시간(분)')}<p>현재 기록: 수학 20분</p><button onclick="try{if(!$('old-time').value.trim())throw Error('시간 값 없음');$('old-result').textContent='새 기록 추가'}catch(e){$('old-result').textContent='오류: '+e.message}">기록 추가 (수정 전)</button><div id="old-result" class="result error">실행 전</div></div><div class="card"><h2>수정 후 · 입력 검사 추가</h2>${field('new-time','시간(분)')}<p>현재 기록: 수학 20분</p><button onclick="$('new-result').textContent=!$('new-time').value.trim()?'시간을 입력하세요. 기존 기록 유지 · 합계 20분':'입력값을 확인하세요.'">기록 추가 (수정 후)</button><div id="new-result" class="result">실행 전</div></div></div><p class="note">같은 빈 입력을 실행합니다. 오류를 의도적으로 넣어 만든 교사 예제이며 학생의 실제 오류 기록은 아닙니다.</p>`}
else{document.body.classList.add('study');study();if(n===12){const b=document.createElement('button');b.textContent='그래프 보기';b.onclick=()=>{graphEnabled=true;render()};app.querySelector('.row').append(b)}if($('chart')){const grid=document.createElement('div');grid.className='data-grid';const t=app.querySelector('table'),c=$('chart');t.before(grid);grid.append(t,c)}}
document.querySelector('nav').innerHTML=[2,3,4,5,6,8,9,10,11,12,13,14,15,16].map(l=>`<a href="?lesson=${l}" style="display:inline-block;margin:10px;color:#244cc1">${l}차시</a>`).join('');
</script></html>
